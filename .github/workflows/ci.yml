name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-dev.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install -r backend/requirements.lock
          python -m pip install pytest==9.0.3 httpx2==2.12.0 ruff==0.15.22
          python -m pip check
      - name: Lint
        run: python -m ruff check backend scripts examples
      - name: Test
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: python -m pytest -q backend/tests

  frontend:
    name: Frontend / Node.js 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, test and build
        working-directory: frontend
        run: npm run check
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: Build independent static demo
        working-directory: frontend
        run: npm run build:demo
      - name: Verify standalone example without installed packages
        run: python3 -I -S examples/fixed_income_brief.py
