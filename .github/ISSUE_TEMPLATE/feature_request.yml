name: 场景与体验反馈
description: 想做什么、卡在哪一步、是否愿意再次使用；有明确功能建议也欢迎补充
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: input
    id: version
    attributes:
      label: AKDesk 版本（可选）
      placeholder: v1.1.0
  - type: input
    id: page
    attributes:
      label: 体验页面（可选）
  - type: dropdown
    id: mode
    attributes:
      label: 启动模式（可选）
      options:
        - 实时模式
        - 演示模式
        - 不确定
  - type: textarea
    id: scenario
    attributes:
      label: 你想完成什么任务？
      description: 描述任务和原来的做法即可，不必提供岗位身份或业务材料。
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 在哪一步停住，或已经完成了什么？（可选）
  - type: textarea
    id: proposal
    attributes:
      label: 下周是否还会使用，为什么？（可选）
      description: 不需要设计解决方案；有明确改进想法也可以写在这里。
  - type: dropdown
    id: area
    attributes:
      label: 主要范围（可选）
      options:
        - 市场监测
        - 投研工作流
        - 信用观察
        - 全球宏观与外汇
        - AI 辅助
        - 数据可信与运维
        - 安装与低门槛体验
        - 在线示例与一页简报
        - 其他
  - type: textarea
    id: alternatives
    attributes:
      label: 其他补充（可选）
  - type: checkboxes
    id: boundaries
    attributes:
      label: 可信边界
      options:
        - label: 我理解项目不承诺实时性、连续性或准确性，也不生成自动投资结论。
          required: true
